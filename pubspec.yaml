publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  cloud_firestore: ^6.7.1
  crypto: ^3.0.7
  firebase_auth: ^6.5.6
  firebase_core: ^4.12.1
