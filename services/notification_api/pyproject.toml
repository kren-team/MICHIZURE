[project]
name = "michizure-notification-api"
version = "0.1.0"
description = "Authenticated FCM notification API for MICHIZURE"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0,<1",
  "firebase-admin>=7.0.0,<8",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0,<1",
  "pytest>=8.4.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notification_api"]
