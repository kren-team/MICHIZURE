[project]
name = "michizure-pose-host"
version = "0.1.0"
description = "Host-only MediaPipe Pose server for the Android emulator demo"
requires-python = ">=3.11"
dependencies = [
  "mediapipe==1.0.0",
  "numpy>=2.0,<3",
  "pillow>=11,<13",
  "websockets==16.1.1",
]

[dependency-groups]
dev = ["pytest>=8.4,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pose_host"]

[tool.pytest.ini_options]
testpaths = ["tests"]
